services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FRONTEND_URL: http://localhost:3001
      PRODUCE_MODEL_PATH: /krishna/cnn_model.pt
      CARDBOARD_MODEL_PATH: /krishna/cardboard_best_model.pt
      MONGODB_URI: mongodb://mongo:27017/freshguard
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ../../krishna:/krishna:ro

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: freshguard
    ports:
      - "27017:27017"
    volumes:
      - freshguard-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

